[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filedrawer"
version = "0.1.0"
description = "A file drawer for AI-generated research reports: BYOT agentic pipeline producing reports, tidy data, reproducible scripts, PAP-tagged analyses, silicon-sampling extensions, and a static dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26",
  "statsmodels>=0.14",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# optional local PII model (GLiNER2-PII, ~200M parameters, CPU): `pip install 'filedrawer[pii-model]'`
pii-model = ["gliner2", "torch", "transformers", "peft", "sentencepiece"]

[project.scripts]
filedrawer = "filedrawer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filedrawer = ["vocab/*.json", "AGENTS.md", "review/prompts/*.yaml", "qsfskill/*.md", "qsfskill/LICENSE", "qsfskill/references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
